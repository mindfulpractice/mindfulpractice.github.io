<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Connect — Light Phone</title>
<style>
  :root {
    --bg: #1a1a1a;
    --fg: #e8e8e8;
    --fg2: #999;
    --accent: #fff;
    --border: #333;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .subtitle {
    font-size: 14px;
    color: var(--fg2);
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .btn {
    display: inline-block;
    padding: 14px 32px;
    background: var(--accent);
    color: var(--bg);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #qr-container {
    margin: 24px auto;
    padding: 20px;
    background: #fff;
    display: inline-block;
    border-radius: 4px;
  }
  #qr-container canvas { display: block; }
  .step {
    font-size: 13px;
    color: var(--fg2);
    margin-top: 16px;
    line-height: 1.6;
  }
  .step strong { color: var(--fg); }
  .error {
    color: #e55;
    font-size: 14px;
    margin: 16px 0;
  }
  .hidden { display: none; }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--fg2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div id="view-start">
    <h1>Tesla Connect</h1>
    <p class="subtitle">Sign in with your Tesla account to connect your Light Phone.</p>
    <button class="btn" onclick="startAuth()">Sign in with Tesla</button>
  </div>

  <div id="view-loading" class="hidden">
    <h1>Connecting...</h1>
    <p class="subtitle"><span class="spinner"></span> Exchanging credentials with Tesla</p>
  </div>

  <div id="view-qr" class="hidden">
    <h1>Scan with Light Phone</h1>
    <p class="subtitle">Open the Tesla tool, tap Connect, and scan this code.</p>
    <div id="qr-container"></div>
    <p class="step">This code expires when you close this page.<br>
    <strong>Do not share it.</strong></p>
  </div>

  <div id="view-error" class="hidden">
    <h1>Something went wrong</h1>
    <p id="error-message" class="error"></p>
    <button class="btn" onclick="startAuth()">Try Again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<script>
  const CLIENT_ID = 'de28b12c-8cbc-4093-af37-dd7701c08f65';
  const CLIENT_SECRET = 'ta-secret.QDHLPYfIjLMl&DmW';
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const SCOPES = 'openid offline_access vehicle_device_data vehicle_cmds vehicle_charging_cmds';
  const AUTH_URL = 'https://auth.tesla.com/oauth2/v3/authorize';
  const TOKEN_URL = 'https://auth.tesla.com/oauth2/v3/token';

  function generateRandom(length) {
    const arr = new Uint8Array(length);
    crypto.getRandomValues(arr);
    return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
  }

  async function sha256(plain) {
    const data = new TextEncoder().encode(plain);
    return await crypto.subtle.digest('SHA-256', data);
  }

  function base64url(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function show(viewId) {
    document.querySelectorAll('.card > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(viewId).classList.remove('hidden');
  }

  function showError(msg) {
    document.getElementById('error-message').textContent = msg;
    show('view-error');
  }

  async function startAuth() {
    const state = generateRandom(16);
    const codeVerifier = generateRandom(32);
    const codeChallenge = base64url(await sha256(codeVerifier));

    sessionStorage.setItem('tesla_state', state);
    sessionStorage.setItem('tesla_verifier', codeVerifier);

    const params = new URLSearchParams({
      response_type: 'code',
      client_id: CLIENT_ID,
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      state: state,
      code_challenge: codeChallenge,
      code_challenge_method: 'S256',
    });

    window.location.href = AUTH_URL + '?' + params.toString();
  }

  async function handleCallback(code, state) {
    show('view-loading');

    const savedState = sessionStorage.getItem('tesla_state');
    const codeVerifier = sessionStorage.getItem('tesla_verifier');

    if (!savedState || state !== savedState) {
      showError('State mismatch — please try again.');
      return;
    }

    try {
      const resp = await fetch(TOKEN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'authorization_code',
          client_id: CLIENT_ID,
          client_secret: CLIENT_SECRET,
          code: code,
          code_verifier: codeVerifier,
          redirect_uri: REDIRECT_URI,
        }),
      });

      if (!resp.ok) {
        const body = await resp.text();
        throw new Error('Tesla returned ' + resp.status + ': ' + body);
      }

      const data = await resp.json();
      const refreshToken = data.refresh_token;

      if (!refreshToken) {
        throw new Error('No refresh token in response.');
      }

      sessionStorage.removeItem('tesla_state');
      sessionStorage.removeItem('tesla_verifier');

      showQR(refreshToken);

    } catch (e) {
      showError(e.message || 'Failed to exchange token.');
    }
  }

  function showQR(token) {
    show('view-qr');
    const container = document.getElementById('qr-container');
    container.innerHTML = '';

    const canvas = document.createElement('canvas');
    container.appendChild(canvas);

    const payload = 'tesla-token:' + token;

    new QRious({
      element: canvas,
      value: payload,
      size: 260,
      level: 'M',
    });
  }

  (function init() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    if (error) {
      history.replaceState(null, '', window.location.pathname);
      showError('Tesla denied access: ' + (params.get('error_description') || error));
    } else if (code && state) {
      history.replaceState(null, '', window.location.pathname);
      handleCallback(code, state);
    } else {
      show('view-start');
    }
  })();
</script>

</body>
</html>
